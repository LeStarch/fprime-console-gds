name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Until an fprime-gds release carries the data_transport plugin category
          pip install "fprime-gds @ git+https://github.com/nasa/fprime-gds@devel"
          pip install -e ".[test]"
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: |
          # What this package brings in, not the tools of the runner; fprime-gds from git is not on PyPI to look up
          pip freeze --exclude-editable | grep -v "^fprime-gds " > installed.txt
          pipx run pip-audit --requirement installed.txt --no-deps --disable-pip
